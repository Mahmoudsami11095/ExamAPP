<button
  [type]="type"
  [disabled]="isLoading || disabled"
  [class]="'w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg text-base font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors ' + additionalClasses"
>
  @if (!isLoading) {
    <span>{{ buttonText }}</span>
  }
  @if (isLoading) {
    <span class="flex items-center">
      <i class="fas fa-spinner fa-spin mr-3 text-white"></i>
      {{ loadingText }}
    </span>
  }
</button>
